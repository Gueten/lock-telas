<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="app.css">
</head>
<body class="popup">
  <div class="brand"><span class="mark"></span>Tela Livre</div>
  <button id="share" class="btn big">Compartilhar minha tela</button>
  <div class="join">
    <h2>Tem um código?</h2>
    <div class="row">
      <input id="code" class="field code-in" placeholder="K7P2QM" maxlength="40" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Código da transmissão">
      <button id="go" class="btn">Assistir</button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
